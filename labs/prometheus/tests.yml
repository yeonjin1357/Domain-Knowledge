rule_files:
  - rules.yml
evaluation_interval: 1m
fuzzy_compare: true
tests:
  - name: reset must be handled before aggregation
    interval: 1m
    input_series:
      - series: requests_total{instance="a"}
        values: '0 10 20 0 10'
      - series: requests_total{instance="b"}
        values: '0 100 200 300 400'
      - series: unsafe_preaggregated_total
        values: '0 110 220 300 410'
    promql_expr_test:
      - expr: sum(rate(requests_total[2m]))
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 1.6666666666666667
      - expr: rate(unsafe_preaggregated_total[2m])
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 1.3333333333333333
      - expr: sum(resets(requests_total[3m]))
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 1
  - name: classic histogram interpolation and weighted error ratio
    interval: 1m
    input_series:
      - series: latency_seconds_bucket{le="0.1"}
        values: '80'
      - series: latency_seconds_bucket{le="0.2"}
        values: '95'
      - series: latency_seconds_bucket{le="+Inf"}
        values: '100'
      - series: failures{instance="a"}
        values: '10'
      - series: failures{instance="b"}
        values: '9'
      - series: completed{instance="a"}
        values: '100'
      - series: completed{instance="b"}
        values: '900'
    promql_expr_test:
      - expr: histogram_quantile(0.90, latency_seconds_bucket)
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 0.16666666666666669
      - expr: sum(failures) / sum(completed)
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 0.019
      - expr: avg(failures / completed)
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 0.055
  - name: for duration and stale is not zero
    interval: 1m
    input_series:
      - series: up{job="demo",instance="local"}
        values: '0 0 0 stale _ _'
    alert_rule_test:
      - eval_time: 1m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 2m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              job: demo
              instance: local
              severity: warning
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: ObservationMissing
        exp_alerts: []
      - eval_time: 4m
        alertname: ObservationMissing
        exp_alerts:
          - exp_labels:
              job: demo
              severity: warning
    promql_expr_test:
      - expr: up{job="demo"}
        eval_time: 3m
        exp_samples: []
      - expr: absent(up{job="demo"})
        eval_time: 3m
        exp_samples:
          - labels: '{job="demo"}'
            value: 1
